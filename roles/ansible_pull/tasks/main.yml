---
- name: Copy ansible-pull service to /etc/systemd/system
  ansible.builtin.copy:
    src: ansible-pull-probable-doodle.service
    dest: /etc/systemd/system/ansible-pull-probable-doodle.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd manager

- name: Copy ansible-pull timer to /etc/systemd/system
  ansible.builtin.copy:
    src: ansible-pull-probable-doodle.timer
    dest: /etc/systemd/system/ansible-pull-probable-doodle.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd manager

- name: Enable and start ansible-pull timer
  ansible.builtin.systemd_service:
    name: ansible-pull-probable-doodle.timer
    enabled: true
    state: "{{ 'started' if systemd_is_booted else omit }}"
