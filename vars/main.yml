---
secrets: {}

domain_name: "{{ secrets.domain_name | default('') }}"
certbot_email: "{{ secrets.certbot_email | default('') }}"

mail_mcp_http_host: "127.0.0.1"
mail_mcp_http_port: 8000
mail_mcp_http_path: "/mcp"

# Safety gates
mail_imap_write_enabled: true
mail_smtp_write_enabled: true
mail_drafts_enabled: true

mail_attachment_upload_dir: "/var/lib/mail-mcp/attachments"
mail_oauth2_token_store: "/var/lib/mail-mcp/tokens.json"

mail_accounts:
  gmail_personal:
    provider: "google"
    imap_host: "imap.gmail.com"
    imap_port: 993
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_secure: "starttls"
  outlook_personal:
    provider: "microsoft"
    imap_host: "outlook.office365.com"
    imap_port: 993
  outlook_work:
    provider: "microsoft"
    imap_host: "outlook.office365.com"
    imap_port: 993
    smtp_host: "smtp.office365.com"
    smtp_port: 587
    smtp_secure: "starttls"
  gmail_school:
    provider: "google"
    imap_host: "imap.gmail.com"
    imap_port: 993
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_secure: "starttls"
